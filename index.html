<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UDS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
    }
    .container { text-align: center; padding: 2rem; max-width: 600px; }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, #f37021, #f7951d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    p { font-size: 1.2rem; line-height: 1.6; opacity: 0.8; margin-bottom: 2rem; }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px;
      font-size: 0.9rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UDS</h1>
    <p>Страница успешно создана и развёрнута на Cloudflare Pages.</p>
    <span class="badge">Powered by Cloudflare Pages</span>
  </div>
</body>
</html>
